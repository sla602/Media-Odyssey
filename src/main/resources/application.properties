# Application settings
spring.config.import=optional:file:.env[.properties]
spring.application.name=Media Odyssey
server.port=${PORT:8080}

# Forwarded headers - Tomcat resolves the trusted proxy headers below into request.getRemoteAddr()
# and request.getScheme(). Override the header names with environment variables if the proxy changes. 
# In local development, without header overrides or these headers present, Tomcat will fall back to the default.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=${TOMCAT_REMOTE_IP_HEADER:CF-Connecting-IP}
server.tomcat.remoteip.protocol-header=${TOMCAT_REMOTE_PROTOCOL_HEADER:X-Forwarded-Proto}

# Tomcat visitor access logging
server.tomcat.basedir=${TOMCAT_BASEDIR:${java.io.tmpdir}/tomcat}
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${ACCESS_LOG_DIRECTORY:${user.dir}${file.separator}logs}
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b
server.tomcat.accesslog.rotate=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${DEV_MODE:FALSE}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${SPRING_DATASOURCE_SCHEMA:public}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Defer datasource initialization until connection is available
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Spring Session
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=postgresql
spring.session.jdbc.cleanup-cron=0 0 * * * *
spring.session.jdbc.save-mode=on-set-attribute
spring.session.jdbc.flush-mode=on-save
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
# Enabling server.servlet.session.cookie.secure improves security. 
# However, requires HTTPS, which is not used in localhost.
# Production will override to "true" via environment variable. Default to "FALSE" during developmental.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:FALSE}

# Spring Security - Remember Me
security.remember-me.key=${REMEMBER_ME_KEY:media-odyssey-remember-me-key}

# Auth API rate limiting.
# The global bucket applies to auth API requests handled by the rate-limit filter.
# Login and email request windows remain separate so each can be tuned independently.
# Login and email requests are more prone to abuse, so they have stricter limits than the global bucket.
# All auth rate limits use the trusted proxy IP header configured above, and they
# also consider the active session when one is available.
auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:TRUE}
auth.rate-limit.global.max-requests=${AUTH_RATE_LIMIT_GLOBAL_MAX_REQUESTS:30}
auth.rate-limit.global.window=${AUTH_RATE_LIMIT_GLOBAL_WINDOW:60m}
auth.rate-limit.login.max-requests=${AUTH_RATE_LIMIT_LOGIN_MAX_REQUESTS:5}
auth.rate-limit.login.window=${AUTH_RATE_LIMIT_LOGIN_WINDOW:15m}
auth.rate-limit.email.max-requests=${AUTH_RATE_LIMIT_EMAIL_MAX_REQUESTS:3}
auth.rate-limit.email.window=${AUTH_RATE_LIMIT_EMAIL_WINDOW:30m}

# Media API Keys
tmdb.api.key=${TMDB_API_KEY:}
rawg.api.key=${RAWG_API_KEY:}
lastfm.api.key=${LASTFM_API_KEY:}
lastfm.api.secret=${LASTFM_API_SECRET:}

# Object storage (Backblaze B2 - S3 compatible)
storage.endpoint=${STORAGE_ENDPOINT:}
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.bucket=${STORAGE_BUCKET:}
storage.public-url=${STORAGE_PUBLIC_URL:}
storage.region=${STORAGE_REGION:}

# Email
email.from=${EMAIL_FROM:}
email.verifytoken.expiry-in-minutes=${VERIFY_TOKEN_EXPIRY_IN_MINUTES:60}
email.resettoken.expiry-in-minutes=${RESET_TOKEN_EXPIRY_IN_MINUTES:30}
resend.api.key=${RESEND_API_KEY:}

# Development mode
dev.mode.enabled=${DEV_MODE:FALSE}
dev.mode.role=${DEV_MODE_ROLE:}
dev.email.suffix=${DEV_EMAIL_SUFFIX:}

# Spring Security OIDC Client
# Spring uses oauth2 property names because OIDC runs on OAuth 2.0.
# Google
spring.security.oauth2.client.registration.google.client-id=${OIDC_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OIDC_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/auth/oauth2/callback/{registrationId}
