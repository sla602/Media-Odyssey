<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Odyssey - Complete email verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/auth/auth-styles.css">
</head>

<body class="auth-page text-light min-vh-100 d-flex flex-column justify-content-center">
    <header class="container px-3 px-lg-4 mb-2">
        <h1 class="mo-title display-4 fw-bold text-light text-center mb-3">MEDIA ODYSSEY</h1>
        <p class="mo-subtitle lead fw-bold text-light text-center mb-1">Discover your next obsession!</p>
        <p class="mo-subtitle lead fw-bold text-light text-center mb-4">Your journey starts here!</p>
    </header>
    <main class="container px-3 px-lg-4 d-flex align-items-center justify-content-center py-2">
        <section class="card auth-card border-0 shadow-lg w-100" style="max-width: 520px;">
            <div class="card-body p-4 p-md-5">
                <h3 class="mo-copy text-center text-light fw-bold mb-3">Complete your verification</h3>
                <p class="text-center text-light mb-4">
                    Click the button below to finish verifying your email.
                </p>

                <form id="verifyForm" class="needs-validation" novalidate>
                    <div class="d-grid gap-2 mb-3">
                        <button id="verifyBtn" type="submit" class="btn mo-btn btn-lg fw-semibold text-white">
                            Finalize Verification
                        </button>
                    </div>
                    <div class="d-grid gap-2">
                        <a href="/auth/resend" class="btn mo-btn btn-lg fw-semibold text-white">Need a new verification
                            link?</a>
                        <a href="/auth/login" class="btn mo-btn btn-lg fw-semibold text-white">Go to Login</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Bootstrap status modal -->
    <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="statusModalLabel">Media Odyssey</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="statusModalBody"></div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-info text-dark fw-semibold" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-0 shadow">
                <div class="modal-body d-flex justify-content-center align-items-center" style="min-height: 120px;">
                    <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/auth/auth-modal-flow.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const { showLoadingModal, showStatusModalAfterLoading, setFormSubmitting } = AuthModalFlow.create();
            const verifyForm = document.getElementById("verifyForm");
            const verifyBtn = document.getElementById("verifyBtn");
            const token = new URLSearchParams(window.location.search).get("token");

            let isSubmitting = false;

            function showBackendErrorOrDefault(resBody) {
                const backendMessage = typeof resBody?.message === "string" ? resBody.message : "";
                showStatusModalAfterLoading(backendMessage || "An unexpected error occurred. Please try again later.");
            }

            if (!token) {
                verifyBtn.disabled = true;
                verifyForm.setAttribute("aria-busy", "false");
                showStatusModalAfterLoading("This verification link is missing a token. Please request a new verification email.", "/auth/resend");
                return;
            }

            verifyForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                if (isSubmitting) {
                    return;
                }

                isSubmitting = true;
                setFormSubmitting(verifyForm, true);
                showLoadingModal();
                try {
                    const res = await fetch(`/api/auth/verify?token=${encodeURIComponent(token)}`, {
                        method: "POST",
                        headers: { "Accept": "application/json" },
                        credentials: "include",
                    });

                    const resText = await res.json();
                    const status = resText?.status;

                    if (status === "AUTH_VERIFY_SUCCESS") {
                        showStatusModalAfterLoading("Your email has been verified successfully. You can now log in using the button below.", "/auth/login");
                    } else if (status === "AUTH_INVALID_VERIFICATION_TOKEN") {
                        showStatusModalAfterLoading("This verification link is invalid or expired. If you have already previously verified your email, please continue to log in. Otherwise, please request a new one.", "/auth/resend");
                    } else if (status === "AUTH_LOCKED") {
                        showStatusModalAfterLoading("Your account is locked. Please contact support.");
                    } else if (status === "AUTH_BAD_REQUEST") {
                        showStatusModalAfterLoading("There was a problem with your verification request. Please try again.");
                    } else {
                        showBackendErrorOrDefault(resText);
                    }
                } catch (error) {
                    showStatusModalAfterLoading("An unexpected error occurred. Please try again later.");
                } finally {
                    isSubmitting = false;
                    setFormSubmitting(verifyForm, false);
                }
            });
        });
    </script>
</body>

</html>
