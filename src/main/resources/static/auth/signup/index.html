<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Odyssey - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/auth/auth-styles.css">
</head>

<body class="auth-page text-light min-vh-100 d-flex flex-column justify-content-center">
    <header class="container px-3 px-lg-4 mb-2">
        <h1 class="mo-title display-4 fw-bold text-light text-center mb-3">MEDIA ODYSSEY</h1>
        <p class="mo-subtitle lead fw-bold text-light text-center mb-1">Discover your next obsession!</p>
        <p class="mo-subtitle lead fw-bold text-light text-center mb-4">Your journey starts here!</p>
    </header>
    <main class="container px-3 px-lg-4 d-flex align-items-center justify-content-center py-2">
        <section class="card auth-card border-0 shadow-lg w-100" style="max-width: 520px;">
            <div class="card-body p-4 p-md-5">
                <h3 class="mo-copy text-center text-light fw-bold mb-3">Start your journey now!</h3>
                <form id="signupForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-lg bg-light text-dark border-secondary"
                            id="email" name="email" autocomplete="email" required placeholder="example@email.com">
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg bg-light text-dark border-secondary"
                            id="password" name="password" autocomplete="new-password" required placeholder="Password">
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg bg-light text-dark border-secondary"
                            id="confirmPassword" name="password" autocomplete="new-password" required
                            placeholder="Confirm password">
                    </div>

                    <div class="row g-2">
                        <div class="col-6 d-grid gap-2">
                            <button type="submit" class="btn mo-btn btn-lg fw-semibold text-white">Sign Up</button>
                        </div>
                        <div class="col-6 d-grid gap-2">
                            <a href="/auth/login" class="btn mo-btn btn-lg fw-semibold text-white">Already have an
                                account? Log In</a>
                        </div>
                        <div class="col-6"></div>
                        <div class="col-6 text-center">
                            <a href="/auth/resend" class="text-white text-decoration-none d-inline-block">Resend verification</a>
                        </div>
                    </div>

                    <div class="text-center my-3 text-light">or</div>

                    <div class="row g-2">
                        <div class="col-12 d-grid gap-2">
                            <a href="/auth/oauth2/authorization/google" class="btn mo-btn btn-lg fw-semibold text-white">
                                Continue with Google
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Bootstrap status modal -->
    <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="statusModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="statusModalLabel">Media Odyssey</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body" id="statusModalBody"></div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-info text-dark fw-semibold" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-0 shadow">
                <div class="modal-body d-flex justify-content-center align-items-center" style="min-height: 120px;">
                    <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/auth/auth-modal-flow.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const { showLoadingModal, showStatusModal, showStatusModalAfterLoading, setFormSubmitting } = AuthModalFlow.create();
            const signupForm = document.getElementById("signupForm");

            let isSubmitting = false;

            function showBackendErrorOrDefault(resBody) {
                const backendMessage = typeof resBody?.message === "string" ? resBody.message : "";
                showStatusModalAfterLoading(backendMessage || "An unexpected error occurred. Please try again later.");
            }

            signupForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                if (isSubmitting) {
                    return;
                }

                if (password !== confirmPassword) {
                    showStatusModal("Passwords do not match.");
                    return;
                }

                isSubmitting = true;
                setFormSubmitting(signupForm, true);
                showLoadingModal();
                try {

                    const payload = {
                        email: email,
                        password: password
                    };

                    const res = await fetch("/api/auth/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify(payload)
                    });

                    const resText = await res.json();
                    const status = resText?.status;

                    // If successful, responds with "OK". Otherwise, attempts default behavior of redirecting (failed).
                    if (status === "AUTH_REGISTER_SUCCESS") {
                        // If successful signup, tell the User. Do not automatically redirect. User needs to be informed to check their email. User can choose to be redirected by closing pop up.
                        showStatusModalAfterLoading("Account created successfully. Please check your email to verify your account.", "/auth/login");
                    } else if (status === "AUTH_INVALID_CREDENTIALS") {
                        showStatusModalAfterLoading("The email is already registered. Please log in.");
                    } else if (status === "AUTH_LOCKED") {
                        showStatusModalAfterLoading("Your account is locked. Please contact support.");
                    } else if (status === "AUTH_BAD_REQUEST") {
                        showStatusModalAfterLoading("There was a problem with the input submitted. Please try again.");
                    } else {
                        showBackendErrorOrDefault(resText);
                    }
                } catch (error) {
                    showStatusModalAfterLoading("An unexpected error occurred. Please try again later.");
                } finally {
                    isSubmitting = false;
                    setFormSubmitting(signupForm, false);
                }
            });
        });
    </script>
</body>

</html>
