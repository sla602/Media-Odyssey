<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Community</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        tr.clickable-row:hover {
            background-color: #f2f2f2;
            cursor: pointer;
        }
    </style>

</head>
<body>

<h2>Join SocialSpace</h2>

<table>
    <thead>
    <tr>
        <th>SocialSpace Name</th>
        <th>Description</th>
    </tr>
    </thead>

    <tbody>

    <!--/*@thymesVar id="socialSpace" type="com.mo.mediaodyssey.socialFeature.models.SocialSpace"*/-->

    <tr th:each="socialSpace : ${socialSpaces}"
        class="clickable-row"
        th:onclick="|window.location='/socialSpaces/' + ${socialSpace.id}|">

        <td th:text="${socialSpace.name}">Community Name</td>
        <td th:text="${socialSpace.description}">Description</td>

    </tr>

    </tbody>
</table>

</body>
</html>
