<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Media Odyssey-Home</title>
        <link rel="stylesheet" th:href="@{/layout/css/global.css}">
        <link rel="stylesheet" th:href="@{/layout/css/fragments.css}">
        <link rel="stylesheet" th:href="@{/layout/css/userProfile.css}">
    </head>
    <body>
        <!--header (display logo[sidebar toggle], homeReturn icon, search bar, user's name and avatar)-->
        <div th:replace="boardsLayout/fragments/header :: header"></div>

        <!-- A side bar that contains features (can be discussed). Side bar can be folded
        Please use the MO logo to work with side bar if needed -->
        <div th:replace="boardsLayout/fragments/sidebar :: sideBar"></div>

        <!--
        * This html is activated when users click on avatar picture, then choose profile.
        ** userProfile.html currently will show user's:
        *   + avatar  +username  +description  +gender  +boards user created  +boards user've joined
        -->

        <!-- MAIN CONTENT STARTS HERE -->
        <main class="user-profile-container">
            <div class="profile-header">

                <!-- Avatar is displayed on the right side as a circle,
                allows user to upload their own profile picture.
                For new users (who haven't uploaded a profile picture yet) just displayed default avatar.
                * This container will always display user's avatar. It will also has a box to contains avatars
                ** (uploaded avatar + default avatar) [ONLY ONE UPLOADED AVATAR]
                -->
                <div class="avatar-container">

                    <!--Display avatar on webpage-->
                    <img th:src="${user.selected_avatar_type == 'custom'
                    ? user.custom_avatar_URL : user.default_avatar_URL}" alt="Avatar" class="avatar-display">

                    <!-- The avatar selection box (that stores avatars) -->

                    <div class="avatar-selection-box hidden" id="avatarSelectionBox">

                        <div class="stored-avatars-display" id="storedAvatarsDisplay">
                        <!-- This element will allow user to upload image files.
                        ** Design choice: It is determined that this element should always be presented even
                        * after the user has uploaded anything. So both custom + default will be displayed.
                        * And this plus button will also be there, for simple & easy to understand design.
                        *
                        *** Logic: we will only accpet: .png, .jpg, .jpeg, .svg files as uploaded avatar.
                        -->
                        <div class="upload-avatar-box" id="uploadAvatarBox">
                            <label for="fileUpload" class="avatar-placeholder">
                                <span class="plus-icon">+</span>
                            </label>
                            <input type="file" id="fileUpload" name="file"
                            accept=".png, .jpg, .jpeg, .svg" style="display: none;">
                        </div>


                            <!-- For the custom avatar -->
                            <img th:if="${user.custom_avatar_URL != null}"
                            th:src="${user.custom_avatar_URL}" alt="Custom Avatar"
                            class="avatar-option" data-avatar-type="custom">

                            <!-- For the default avatar -->
                            <img th:src="${user.default_avatar_URL}" alt="Default Avatar"
                            class="avatar-option" data-avatar-type="default">
                        </div>
                    </div>

                </div>

                <!-- User info section -->
                <!-- ============================================================
                     OWN PROFILE: editable form with Save button
                     ============================================================ -->
                <div class="user-info-box">

                    <!-- ─── VIEW MODE (default, always visible on load) ─── -->
                    <div id="profileView" class="profile-view-mode">

                        <div class="info-field">
                            <label class="info-label">
                                <span class="info-label-icon">@</span>
                                Username
                            </label>
                            <div class="info-items info-items-readonly"
                                 th:text="${profile?.username != null and !#strings.isEmpty(profile?.username)
                                           ? profile.username : 'No username set'}">No username set</div>
                        </div>

                        <div class="info-field">
                            <label class="info-label">
                                <span class="info-label-icon">✎</span>
                                About
                            </label>
                            <div class="info-items info-items-readonly"
                                 th:text="${profile?.description != null and !#strings.isEmpty(profile?.description)
                                           ? profile.description : 'No description'}">No description</div>
                        </div>

                        <div class="info-field">
                            <label class="info-label">
                                <span class="info-label-icon">☺</span>
                                Pronouns
                            </label>
                            <div class="info-items info-items-readonly"
                                 th:text="${profile?.pronouns != null and !#strings.isEmpty(profile?.pronouns)
                                           ? profile.pronouns : 'Not specified'}">Not specified</div>
                        </div>

                        <!-- Action row: Edit button (own profile) OR Add Friend button (other user) -->
                        <div class="profile-action-row">

                            <!-- ─── OWN PROFILE: Edit Profile button ─── -->
                            <th:block th:if="${isOwnProfile == null or isOwnProfile}">
                                <button type="button" class="edit-profile-btn"
                                        onclick="toggleProfileEdit(true)">
                                    <span class="btn-icon">✎</span> Edit Profile
                                </button>
                            </th:block>

                            <!-- ─── OTHER USER: Add Friend button states ─── -->
                            <th:block th:if="${isOwnProfile != null and !isOwnProfile}">
                                <!-- Not connected yet -> Add Friend -->
                                <th:block th:if="${friendStatus == 'NONE'}">
                                    <form th:action="@{'/profile/' + ${profileUserId} + '/add-friend'}"
                                          method="post" class="action-form">
                                        <button type="submit" class="add-friend-btn">
                                            <span class="btn-icon">+</span> Add Friend
                                        </button>
                                    </form>
                                </th:block>

                                <!-- Already sent a request -->
                                <th:block th:if="${friendStatus == 'REQUEST_SENT'}">
                                    <button type="button" class="add-friend-btn friend-req-sent" disabled>
                                        Friend Request Sent
                                    </button>
                                    <a th:href="@{/friends}" class="cancel-hint">Go to Friends page to cancel</a>
                                </th:block>

                                <!-- They sent us one -->
                                <th:block th:if="${friendStatus == 'REQUEST_RECEIVED'}">
                                    <a th:href="@{/friends}" class="add-friend-btn friend-req-received">
                                        Respond to Request
                                    </a>
                                </th:block>

                                <!-- Already friends -->
                                <th:block th:if="${friendStatus == 'FRIENDS'}">
                                    <button type="button" class="add-friend-btn friend-already" disabled>
                                        Friends
                                    </button>
                                </th:block>
                            </th:block>
                        </div>
                    </div>

                    <!-- ─── EDIT MODE (own profile only, hidden by default) ─── -->
                    <th:block th:if="${isOwnProfile == null or isOwnProfile}">
                        <form id="profileEdit"
                              th:action="@{/profile/save}"
                              method="post"
                              class="profile-edit-mode hidden">

                            <div class="info-field">
                                <label class="info-label" for="usernameInput">
                                    <span class="info-label-icon">@</span>
                                    Username
                                </label>
                                <input type="text" id="usernameInput" name="username"
                                       placeholder="Choose a username"
                                       class="info-items" th:value="${profile?.username}">
                            </div>

                            <div class="info-field">
                                <label class="info-label" for="descriptionInput">
                                    <span class="info-label-icon">✎</span>
                                    About
                                </label>
                                <textarea id="descriptionInput" name="description"
                                          placeholder="Tell others a bit about yourself..."
                                          class="info-items info-items-textarea"
                                          rows="3" th:text="${profile?.description}"></textarea>
                            </div>

                            <div class="info-field">
                                <label class="info-label" for="pronounsInput">
                                    <span class="info-label-icon">☺</span>
                                    Pronouns
                                </label>
                                <input type="text" id="pronounsInput" name="pronouns"
                                       placeholder="e.g. she/her, they/them, he/him"
                                       class="info-items" th:value="${profile?.pronouns}">
                            </div>

                            <div class="profile-action-row edit-action-row">
                                <button type="submit" class="save-profile-btn">
                                    <span class="btn-icon">✓</span> Save Changes
                                </button>
                                <button type="button" class="cancel-edit-btn"
                                        onclick="toggleProfileEdit(false)">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </th:block>

                </div>
            </div>

            <!-- Intended for display boards but is waiting to see how the boards logic change from Prab-->
            <div class="profile-middle">
                <div class="boards-display-box">
                    <div class="boards-created boardItem"></div>

                    <div class="boards-joined boardItem"></div>
                </div>
            </div>

            <div class="profile-footer"></div>
        </main>

        <script th:src="@{/layout/js/fragments.js}"></script>
        <script th:src="@{/layout/js/userProfile.js}"></script>
        <script>
            // Swap between view mode and edit mode on the profile page
            function toggleProfileEdit(enterEditMode) {
                const view = document.getElementById('profileView');
                const edit = document.getElementById('profileEdit');
                if (!view || !edit) return;
                if (enterEditMode) {
                    view.classList.add('hidden');
                    edit.classList.remove('hidden');
                } else {
                    edit.classList.add('hidden');
                    view.classList.remove('hidden');
                }
            }
        </script>
    </body>
</html>
