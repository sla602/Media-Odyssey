<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Odyssey - Community Favourites</title>
    <link rel="stylesheet" th:href="@{/layout/css/global.css}">
    <link rel="stylesheet" th:href="@{/layout/css/fragments.css}">
    <link rel="stylesheet" th:href="@{/layout/css/featureStyle/trending.css}">

    <style>
      /* =============================================
         COMMUNITY FAVOURITES PAGE STYLES
         Matches homePage.css and fragments.css theme
         Dark purple/indigo palette, Space Grotesk font
         ============================================= */

      /* === Page Title === */
      .main-content h1 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #e0e0e0;
        letter-spacing: 0.5px;
        margin-bottom: 1.25rem;
      }

      /* === Score Info Banner === */
      /* Subtle info box explaining the popularity score formula */
      .score-info {
        background: linear-gradient(135deg, #1e1e3f 0%, #2d2d5a 100%);
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-left: 3px solid #6366f1;
        border-radius: 10px;
        padding: 0.75rem 1.25rem;
        font-size: 0.88rem;
        color: #a0a0b0;
        margin-bottom: 1.5rem;
        line-height: 1.6;
        flex-direction: column;
        display: flex;
      } 

      .score-info strong {
        color: #c4b5fd;
      }

      /* === Category Tabs === */
      /* Pill-style filter tabs matching rec-tab style from homePage.css */
      .tab-container {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        flex-wrap: wrap;
      }

      .tab-container a {
        text-decoration: none;
      }

      .tab-btn {
        padding: 0.625rem 1.25rem;
        background: #1a1a2e;
        border: 1px solid #2d2d5a;
        border-radius: 25px;
        color: #a0a0b0;
        font-size: 0.9rem;
        font-family: 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tab-btn:hover {
        background: #252545;
        color: #ffffff;
      }

      /* Active tab uses the same indigo gradient as homePage rec-tabs */
      .tab-btn.active {
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        border-color: transparent;
        color: #ffffff;
      }

      /* === Divider === */
      hr {
        border: none;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(139, 92, 246, 0.3) 50%,
          transparent 100%
        );
        margin: 1.5rem 0;
      }

      /* === Section Headings === */
      /* Shared h2 style for Fast-Rising and Top 10 sections */
      .trending-section h2,
      .ranking-section h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #e0e0e0;
        letter-spacing: 0.5px;
        margin-bottom: 1.25rem;
      }

      /* === Empty State Message === */
      .trending-section p,
      .ranking-section p {
        color: #6b7280;
        font-size: 0.9rem;
      }

      /* === Popularity Score Block === */
      /* Shown inside Top 10 cards below the title; same 11px/aaa style as rec-meta */
      .popularity-score {
        padding: 0 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 13px;
        color: #aaa;
      }

      /* Highlighted score number */
      .score-number {
        color: #c4b5fd;
        font-weight: 700;
        font-size: 13px;
      }

      /* Secondary detail line: likes · views */
      .score-detail {
        font-size: 13px;
        color: #6b7280;
      }

      /* =============================================
         RESPONSIVE ADJUSTMENTS
         ============================================= */
      @media (max-width: 1100px) {
        /* 4-column on medium screens — keeps rows even for Top 10 (4+4+2) */
        #trendingGrid,
        #top10Grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (max-width: 900px) {
        /* 3-column on narrow screens */
        #trendingGrid,
        #top10Grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 768px) {
        .tab-container {
          gap: 0.5rem;
        }

        .tab-btn {
          padding: 0.5rem 1rem;
          font-size: 0.8rem;
        }

        /* 2-column on tablet */
        #trendingGrid,
        #top10Grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 480px) {
        .main-content h1 {
          font-size: 1.4rem;
        }

        /* Single column on mobile */
        #trendingGrid,
        #top10Grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header: logo, home button, search bar, avatar -->
    <div th:replace="boardsLayout/fragments/header :: header"></div>

    <!-- Sidebar: navigation links -->
    <!-- A side bar that contains features (can be discussed). Side bar can be folded
        Please use the MO logo to work with side bar if needed -->
    <div th:replace="boardsLayout/fragments/sidebar :: sideBar"></div>

    <main class="main-content">
      <h1>Community Favourites</h1>

      <!-- ── Score explanation ──────────────────────────────────────── -->
      <!-- Tells users how the Popularity Score is calculated -->
      <div class="score-info">
        <div class="score-item"></div>
         <strong>🔥 Fast-Rising Score</strong> = total likes received in the past 7 days — reflects what's gaining momentum right now.
         <strong>⭐ Popularity Score</strong> = views × 1 + likes × 10 — the more the community interacts, the higher the score.
      </div>

      <!-- ── Category Tabs ──────────────────────────────────────────── -->
      <!--
                Server-side filter: reloads with ?category= param.
                Tab values match UserInteraction mediaType: MOVIE, GAME, SONG.
            -->
      <div class="tab-container">
        <button class="tab-btn active" data-type="ALL">All</button>
        <button class="tab-btn" data-type="MOVIE">Movies</button>
        <button class="tab-btn" data-type="GAME">Games</button>
        <button class="tab-btn" data-type="SONG">Songs</button>
      </div>
<hr />

      <!-- ── Fast-Rising Top 5 ───────────────────────────────────────── -->
      <!--
                Top 5 most-liked items in the past 7 days.
                Data comes from UserInteraction table via MediaRankingService.

              
            -->
      <section class="trending-section">
        <h2>🔥 Fast-Rising This Week (Top 5)</h2>
        <!-- Status message (loading / empty) -->
        <p id="trendingStatus"></p>
        <!-- Cards rendered here by trending.js -->
        <div id="trendingGrid"></div>
      </section>

      <hr />

      <!-- ── Top 10 Ranked ──────────────────────────────────────────── -->
      <!--
                Ranked by Point System: LIKE × 10 + VIEW × 1.
                Aggregated from UserInteraction table via MediaRankingService.

                Current iteration:
                - keep internal score for sorting
                - show popularity score in UI (views * 1 + likes * 10)
                - do not show like button on the card UI

                
            -->
      <section class="ranking-section">
        <h2>🏆 Top 10 Ranked</h2>
        <!-- Status message (loading / empty) -->
        <p id="top10Status"></p>
        <!-- Cards rendered here by trending.js -->
        <div id="top10Grid"></div>
      </section>
    </main>

    <!-- ── JavaScript ──────────────────────────────────────────────────── -->
<!-- This js script path: ensures sidebar + header logic -->
    <script th:src="@{/layout/js/trending.js}"></script>
    <script th:src="@{/layout/js/fragments.js}"></script>
</body>
</html>
