<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta charset="UTF-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Board's name</title>
        <link rel="stylesheet" th:href="@{/layout/css/global.css}">
        <link rel="stylesheet" th:href="@{/layout/css/fragments.css}">
        <link rel="stylesheet" th:href="@{/layout/css/boardPages.css}">

    </head>
    <body>
        <!-- This html will show when a user click on any board. Potential, this board will display 
         seperate sections for music, game, movies. Those objects will be clickable for users to click on
         for more specific informations
        -->
        
        <!--header (display logo[sidebar toggle], homeReturn icon, search bar, user's name and avatar)-->
        <div th:replace="boardsLayout/fragments/header :: header"></div>

        <!-- A side bar that contains features (can be discussed). Side bar can be folded
         Please use the MO logo to work with side bar if needed -->
        <div th:replace="boardsLayout/fragments/sidebar :: sideBar"></div>

        <!-- main content starts here -->
        <main class="board-container">

            <!-- Top section: Board's avatar + Basic Info -->
            <div class="board-header">

                <!-- Avatar may be commented out for now
                <div class="board-avatar">
                    <img src="" alt="avt">
                </div> --> 

                <div class="board-Info">
                    <!-- BOARD TITLE -->
                    <h1 class="board-title" th:text="${board.board_name}"></h1>

                    <!-- BOARD'S DESCRIPTION: description is optional so this space may or may not be blank
                    Unsure how much it would visually effect the layout in general. Doesn't look that bad for now.-->
                    <div class="board-desciption">
                        <span th:text="${board.board_description}"></span>
                    </div>

                    <!-- BOARD'S META: Show whether the board is public or private.-->
                    <div class="board-meta">
                        <span class="board-type-badge" th:text="${board.board_type}"></span>
                    </div>
                </div>
            </div>


            <!-- Middle Section: Community's Post + Media display -->
            <div class="board-middle">
                <!-- Let user choose to either see the posts or the media in this board-->
                <div class="middle-select">
                    <button class="board-post active" id="postsBtn">POST</button>
                    <button class="board-media active" id="mediaBtn">MEDIA</button>
                </div>

                <!-- This section will be reserved for Post (Prab) -->
                <div class="board-POST-container" id="postsContainer"></div>


                <!-- Create Post Form -->
                <div class="create-post-section">
                    <form th:action="@{/boards/display/{id}/posts(id=${board.id})}" method="post" class="create-post-form">
                        <input type="text" name="title" class="post-input-title"
                               placeholder="Post title" maxlength="200" required/>
                        <textarea name="content" class="post-input-content"
                                  placeholder="What's on your mind?" maxlength="10000"
                                  rows="4" required></textarea>
                        <div class="create-post-actions">
                            <button type="submit" class="btn-submit">Post</button>
                        </div>
                    </form>
                </div>

                <!-- Post List -->
                <div th:if="${#lists.isEmpty(posts)}">
                    <p class="empty-message">No posts yet. Be the first to post!</p>
                </div>

                <div th:each="post : ${posts}" class="post-card">
                    <!-- Clickable area — links to post view page -->
                    <a th:href="@{/boards/display/{boardId}/posts/{postId}(boardId=${board.id}, postId=${post.id})}" class="post-card-link">
                        <div class="post-card-header">
                            <span class="post-author" th:text="'User #' + ${post.authorId}"></span>
                            <span class="post-time" th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy h:mm a')}"></span>
                        </div>
                        <h3 class="post-card-title" th:text="${post.title}"></h3>
                        <p class="post-card-content" th:text="${post.content}"></p>
                    </a>

                    <!-- Action Buttons -->
                    <div class="post-card-actions">

                        <!-- OP viewing their own post: delete, edit, reply -->
                        <th:block th:if="${post.authorId == currentUserId}">
                            <form th:action="@{/boards/display/{boardId}/posts/{postId}/delete(boardId=${board.id}, postId=${post.id})}"
                                  method="post" class="action-form">
                                <button type="submit" class="action-btn action-delete"
                                        onclick="return confirm('Delete this post?')">Delete</button>
                            </form>
                            <a th:href="@{/boards/display/{boardId}/posts/{postId}/edit(boardId=${board.id}, postId=${post.id})}"
                               class="action-btn action-edit">Edit</a>
                            <a th:href="@{/boards/display/{boardId}/posts/{postId}(boardId=${board.id}, postId=${post.id})}"
                               class="action-btn action-reply">Reply</a>
                        </th:block>

                        <!-- Owner or Moderator viewing someone else's post: delete, reply, report -->
                        <th:block th:if="${post.authorId != currentUserId and (currentUserRole == 'OWNER' or currentUserRole == 'MODERATOR')}">
                            <form th:action="@{/boards/display/{boardId}/posts/{postId}/delete(boardId=${board.id}, postId=${post.id})}"
                                  method="post" class="action-form">
                                <button type="submit" class="action-btn action-delete"
                                        onclick="return confirm('Delete this post?')">Delete</button>
                            </form>
                            <a th:href="@{/boards/display/{boardId}/posts/{postId}(boardId=${board.id}, postId=${post.id})}"
                               class="action-btn action-reply">Reply</a>
                            <a href="#" class="action-btn action-report">Report</a>
                        </th:block>

                        <!-- Regular member viewing someone else's post: reply, report -->
                        <th:block th:if="${post.authorId != currentUserId and currentUserRole == 'MEMBER'}">
                            <a th:href="@{/boards/display/{boardId}/posts/{postId}(boardId=${board.id}, postId=${post.id})}"
                               class="action-btn action-reply">Reply</a>
                            <a href="#" class="action-btn action-report">Report</a>
                        </th:block>

                    </div>
                </div>
            </div>



            <!-- Footer Section: in thoughts progress...-->
        </main>

        <script th:src="@{/layout/js/fragments.js}"></script>
        <script th:src="@{/layout/js/boardPages.js}"></script>

    </body>
</html>
