<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${post.title}">Post</title>

    <style>
        body{
            font-family: Arial;
            width:70%;
            margin:auto;
        }

        .post-box{
            border:1px solid #ccc;
            padding:15px;
            margin-top:20px;
        }

        .comment{
            border:1px solid #ddd;
            padding:10px;
            margin-top:10px;
        }

        .comment-actions{
            margin-top:5px;
        }

        textarea{
            width:100%;
            height:70px;
        }


        button{
            margin-top:5px;
        }
    </style>
</head>

<body>

<main class="container">

    <article class="post-detail">

        <div th:if="${post.deleted}" class="deleted-notice">
            <h1 th:text="${post.title}"></h1>
            <p class="muted">[Deleted].</p>
            <p>Originally posted by <strong th:text="${postUsername}"></strong></p>
        </div>

        <div th:unless="${post.deleted}">

            <!-- EDIT MODE -->
            <div th:if="${editMode}" class="edit-mode">
                <form th:action="@{/posts/{id}/edit(id=${post.id})}" method="post">

                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text"
                               id="title"
                               name="title"
                               th:value="${post.title}"
                               class="form-control" required />
                    </div>

                    <div class="form-group">
                        <label for="content">Content:</label>
                        <textarea id="content"
                                  name="content"
                                  rows="10"
                                  class="form-control" th:text="${post.content}"> required>
                    </textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/posts/{id}(id=${post.id})}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>

            <!-- NORMAL VIEW MODE -->
            <div th:unless="${editMode}">
                <h1 th:text="${post.title}">Post Title</h1>

                <div class="post-meta">
                    <span>Posted by <strong th:text="${postUsername}"></strong></span>
                    <span>•</span>
                    <!-- <span th:text="${#temporals.format(post.createdAt, 'MMM dd, yyyy HH:mm')}"></span> -->
                </div>

                <div class="post-content" th:utext="${post.content != null ? post.content : ''}">
                    Post content...
                </div>

                <!-- Post Actions -->
                <div class="post-actions" th:if="${currentUserId != null}">
                    <!-- Edit button - only author -->
                    <a th:if="${currentUserId == post.authorId}"
                       th:href="@{/posts/{id}/edit(id=${post.id})}"
                       class="btn btn-secondary">Edit Post</a>

                    <!-- Delete button -->
                    <form th:if="${currentUserId == post.authorId or currentUserRole == 'MODERATOR' or currentUserRole == 'OWNER'}"
                          th:action="@{/posts/{id}/delete(id=${post.id})}"
                          method="post"
                          onsubmit="return confirm('Are you sure you want to delete this post?');">
                        <button type="submit" class="btn btn-danger">Delete Post</button>
                    </form>
                </div>
            </div>

        </div>

    </article>

<hr>


<!-- Comments Section -->
<section class="comments-section">
    <h2>Comments (<span th:text="${#lists.size(comments)}">0</span>)</h2>

    <!-- Comment List -->
    <div th:each="comment : ${comments}"
         th:style="'margin-left: ' + ${(comment.depth != null ? comment.depth : 0) * 30} + 'px;'"
         class="comment-thread">

        <div class="comment" th:classappend="${comment.deleted ? 'deleted-comment' : ''}">

            <!-- Username -->
            <div class="comment-header">
                <strong th:text="${comment.deleted ? '[Deleted]' : comment.username}"></strong>
            </div>

            <!-- Content -->
            <div class="comment-content">
                <p th:if="${comment.deleted}">
                    <em>[Comment deleted]</em>
                </p>
                <p th:unless="${comment.deleted}" th:text="${comment.content}">
                    Comment text...
                </p>
            </div>

            <!-- Comment Actions -->
            <div class="comment-actions" th:if="${currentUserId != null and !comment.deleted}">
                <!-- Reply -->
                <form th:action="@{/comments/reply/{id}(id=${comment.id})}" method="post">
                    <input type="text" name="content" placeholder="Reply..." required>
                    <button type="submit">Reply</button>
                </form>

                <!-- Edit - only own comment -->
                <form th:if="${currentUserId == comment.authorId}"
                      th:action="@{/comments/{id}/edit(id=${comment.id})}" method="post">
                    <input type="text" name="newContent" th:value="${comment.content}" required>
                    <button type="submit">Edit</button>
                </form>

                <!-- Delete - own comment (or mod/owner if you allow) -->
                <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </div>

        </div>
    </div>

    <!-- No comments message -->
    <p th:if="${#lists.isEmpty(comments)}" class="muted">No comments yet.</p>

    <!-- Add new top-level comment form -->
    <div class="add-comment" th:if="${currentUserId != null}">
        <h3>Leave a comment</h3>
        <form th:action="@{/comments/post/{postId}(postId=${post.id})}" method="post">
            <textarea name="content" rows="4" placeholder="Write your comment..." required></textarea>
            <button type="submit">Post Comment</button>
        </form>
    </div>
</section>

</main>

</body>
</html>
