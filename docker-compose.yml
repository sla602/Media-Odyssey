services:
  app:
    container_name: mediaodyssey_app
    # For local development, uncomment below to build the image from the Dockerfile in the project root.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: media-odyssey-app

    # Image is built and published to GHCR by the build-publish-deploy workflow. Comment out below if building locally.
    image: ${GHCR_IMAGE:-ghcr.io/sla602/media-odyssey:main}

    # App runtime variables are loaded from the .env file.
    env_file:
      - .env

    # Run as unprivileged user.
    # 1000 is the default UID/GID for the first non-root user/group on many Linux systems, respectively.
    user: "1000:1000"

    # Prevent the app from gaining additional privileges.
    security_opt:
      - no-new-privileges:true

    # Drop all Linux kernel capabilities.
    cap_drop:
      - ALL

    # Keep the image filesystem immutable; writable paths are explicit below.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    pids_limit: 512

    # Expose application port for access by Cloudflare Tunnel.
    expose:
      - ${PORT:-8080}

    # Keep common host aliases from resolving to the Docker host.
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
      - "host.containers.internal:127.0.0.1"

    # Mount a volume for application logs.
    volumes:
      - type: bind
        source: /logs
        target: /logs
        bind:
          create_host_path: false

    # Wait for the database to be healthy before starting the app.
    depends_on:
      db:
        condition: service_healthy

    networks:
      - mediaodyssey_frontend
      - mediaodyssey_backend

    # Always restart the app unless it is explicitly stopped.
    restart: unless-stopped

  tunnel:
    container_name: mediaodyssey_tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}

    # Run as unprivileged user. Distroless images often use 65532 as the default unprivileged UID/GID.
    user: "65532:65532"

    # Prevent the app from gaining additional privileges.
    security_opt:
      - no-new-privileges:true

    # Drop all Linux kernel capabilities.
    cap_drop:
      - ALL

    # Keep the tunnel container stateless and limit process fan-out.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    pids_limit: 128

    # Wait for the app to start before starting the tunnel.
    depends_on:
      app:
        condition: service_started

    networks:
      - mediaodyssey_frontend

    # Always restart the tunnel unless it is explicitly stopped.
    restart: unless-stopped

  db:
    container_name: mediaodyssey_db
    image: postgres:18-alpine

    # Run as unprivileged postgres user (UID/GID 70 in official Postgres images)
    user: "70:70"

    # Prevent the app from gaining additional privileges.
    security_opt:
      - no-new-privileges:true

    # Drop all Linux kernel capabilities.
    cap_drop:
      - ALL

    # Bound database process fan-out without changing PostgreSQL's writable data path.
    pids_limit: 256

    # Database credentials and settings are loaded from the .env file.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Verifies that the database continues to stay up and responsive.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    # Mount a volume to persist database data.
    volumes:
      - postgres-data:/var/lib/postgresql

    networks:
      - mediaodyssey_backend

    # Always restart the database unless it is explicitly stopped.
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  mediaodyssey_frontend:
  mediaodyssey_backend:
    internal: true
