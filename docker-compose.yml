services:
  app:
    container_name: mediaodyssey_app
    # For local development, uncomment below to build the image from the Dockerfile in the project root.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: media-odyssey-app

    # Image is built and published to GHCR by the build-publish-deploy workflow. Comment out below if building locally.
    image: ${GHCR_IMAGE:-ghcr.io/sla602/media-odyssey:main}

    # App runtime variables are loaded from the root .env file.
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    container_name: mediaodyssey_tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    container_name: mediaodyssey_db
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data:
